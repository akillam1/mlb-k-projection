name: Daily refresh
# Two runs a day (Arizona = UTC-7 year-round, no DST juggling):
#   04:10 UTC = 9:10 PM AZ  — MAIN model refresh, after most games complete:
#                             scores the finished slate, retrains features,
#                             projects the FOLLOWING day. No odds calls.
#   17:10 UTC = 10:10 AM AZ — morning odds run: game lines (2 credits) +
#                             K props (~1/game ≈ 14) for today's slate, plus
#                             late West-coast finals from last night.
# Odds budget (500 free credits/mo): ~480/mo. West-coast games that end after
# 9 PM AZ settle on the morning run. The targeted line-movement re-pull
# (22-23 UTC window) now fires only on manual runs in that window.
# Tap "Run workflow" in the GitHub app for an on-demand refresh any time
# (odds_mode input: auto = hour-based, or force gamelines/props/both/off).

on:
  schedule:
    - cron: "10 4 * * *"    # 9:10 PM AZ — main refresh: score finished games, project next day
    - cron: "10 17 * * *"   # 10:10 AM AZ — odds run: game lines + K props, late finals
  workflow_dispatch:
    inputs:
      odds_mode:
        description: "Odds fetch: auto (hour-based) / both / gamelines / props / off"
        type: choice
        default: auto
        options: [auto, both, gamelines, props, off]

concurrency:
  group: kproj-db
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-kproj
      - name: Run daily cycle
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          KPROJ_ODDS_MODE: ${{ inputs.odds_mode || 'auto' }}
        run: python -m kproj daily
      - uses: ./.github/actions/save-kproj
