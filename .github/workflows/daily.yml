name: Daily refresh
# 3 in-season runs (UTC): ~10:10, ~15:10, ~18:40 ET during DST.
# The 18:40 ET pass catches confirmed lineups for most evening slates.
# Tap "Run workflow" in the GitHub app for an on-demand refresh any time.

on:
  schedule:
    - cron: "10 14 * * *"
    - cron: "10 19 * * *"
    - cron: "40 22 * * *"
  workflow_dispatch:

concurrency:
  group: kproj-db
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-kproj
      - name: Run daily cycle
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python -m kproj daily
      - uses: ./.github/actions/save-kproj
