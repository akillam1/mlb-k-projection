name: Daily refresh
run-name: "Daily refresh — ${{ inputs.slot || 'GitHub cron backstop' }}"

# ---------------------------------------------------------------------------
# TIMING (Arizona = UTC-7 all year, no DST)
#
#   7:00 PM AZ / 02:00 UTC — roll the board to TOMORROW, settle tonight's
#                            finished games. No odds credits spent.
#   8:00 AM AZ / 15:00 UTC — morning refresh: game lines + K props for today,
#                            plus any late West-coast finals from last night.
#   3:00 PM AZ / 22:00 UTC — pre-slate refresh + top-edge line-movement re-pull.
#
# HOW THE TIMES ARE ACTUALLY HIT
# GitHub's hosted cron is best-effort and, on this repo, has run several hours
# late (see the run history), and a single sparse daily check-in per slot means
# a late scheduler run waits for the NEXT slot to catch up — which is why the
# board used to publish around 10-11 PM instead of the intended time. There is
# no Cloudflare Worker wired up to fire on-the-minute right now (see
# infra/cloudflare-worker/, currently dormant), so the schedule below is dense
# on purpose: every 15 minutes across each target window, so that whenever
# GitHub gets around to running the cron, the gap between "went stale" and
# "caught and republished" stays small.
#
# The `gate` job drops a run whose data is already fresh (< 2h), so almost
# every one of these dense check-ins is a ~15s no-op — only the first one
# after data goes stale actually runs the pipeline. It fails open — only an
# explicit "fresh" verdict stops the pipeline. Odds credits are unaffected:
# every odds fetch is separately gated by day + UTC window + a once-per-day
# KV flag (kproj/cli.py cmd_daily), so running the gate more often does not
# fetch odds more often.
#
# Odds budget (500 free credits/mo): game lines 2/day + props ~14/day + the
# top-edge movement re-pull ~3/day ≈ 19/day ≈ 590 raw, over the free tier. Every
# call goes through budget_ok() (kproj/ingest/odds.py), which stops spending at
# ODDS_BUDGET_FLOOR — late in the month the movement re-pull bows out first and
# projections are never affected.
#
# The board no longer depends on when this runs: util.board_date() rolls the
# slate at 7 PM AZ regardless of when the job actually starts.
# ---------------------------------------------------------------------------

on:
  schedule:
    - cron: "7-59/15 15-19 * * *"   # dense backstop — 8:07 AM to 12:52 PM AZ (odds + lineup window)
    - cron: "7-59/15 22-23 * * *"   # dense backstop — 3:07 PM to 4:52 PM AZ (pre-slate window)
    - cron: "7-59/15 0-4 * * *"     # dense backstop — 5:07 PM to 9:52 PM AZ (rollover window)
  workflow_dispatch:
    inputs:
      slot:
        description: "Label for this run (the Worker passes the slot name)"
        type: string
        default: "manual"
      odds_mode:
        description: "Odds fetch: auto (hour-based) / both / gamelines / props / off"
        type: choice
        default: auto
        options: [auto, both, gamelines, props, off]
      force:
        description: "Run even if the data is already fresh"
        type: boolean
        default: true

concurrency:
  group: kproj-db
  cancel-in-progress: false

permissions:
  contents: write

env:
  FRESH_MINUTES: "120"

jobs:
  # Cheap guard so a late GitHub backstop doesn't redo work the Worker already
  # did. Reads the committed meta.json — no API calls, no DB download.
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      run: ${{ steps.check.outputs.run }}
      age: ${{ steps.check.outputs.age }}
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            docs/data/meta.json
            .github/scripts/gate.py
          sparse-checkout-cone-mode: false
      - id: check
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
        run: python3 .github/scripts/gate.py

  daily:
    needs: gate
    # Fail OPEN, matching gate.py: only an explicit 'false' stops the run. If the
    # gate job itself dies (runner hiccup, timeout), the board still updates.
    if: always() && needs.gate.outputs.run != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup-kproj
      - name: Run daily cycle
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          KPROJ_ODDS_MODE: ${{ inputs.odds_mode || 'auto' }}
          KPROJ_TRIGGER: ${{ inputs.slot || format('backstop {0}', github.event.schedule) }}
        run: python -m kproj daily
      - uses: ./.github/actions/save-kproj
