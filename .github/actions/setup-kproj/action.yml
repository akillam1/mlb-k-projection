name: Setup kproj
description: Python + deps + pull SQLite DB and model artifacts from the rolling release
inputs:
  need-models:
    description: download model artifacts too
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        cache: pip
    - shell: bash
      run: pip install -q -r requirements.txt
    - name: Restore DB + models from rolling release (fail-safe)
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        mkdir -p data models
        if ! gh release view data-latest >/dev/null 2>&1; then
          echo "No rolling release yet -> genuine fresh start."
          echo "0" > data/.restore_rows
          exit 0
        fi
        # Release exists. Read its asset list so we can tell "DB asset genuinely
        # absent" (ok to start fresh) from "asset present but download failed"
        # (dangerous -> must abort so we never overwrite good data with empty).
        ASSETS="$(gh release view data-latest --json assets --jq '.assets[].name' 2>/dev/null || echo __ERR__)"
        if [ "$ASSETS" = "__ERR__" ]; then
          echo "::error::Could not read data-latest's asset list (API/network hiccup). Aborting to be safe -> just re-run the job."
          exit 1
        fi
        if printf '%s\n' "$ASSETS" | grep -qx 'kproj.db.gz'; then
          echo "kproj.db.gz asset present -> DB restore is REQUIRED."
          if ! gh release download data-latest -p kproj.db.gz -D data --clobber; then
            echo "::error::kproj.db.gz exists on the release but failed to download. Aborting so a transient"
            echo "::error::failure cannot overwrite the good database with an empty one. Just re-run the job."
            exit 1
          fi
          gunzip -f data/kproj.db.gz
          n="$(python -c "import sqlite3; print(sqlite3.connect('data/kproj.db').execute('SELECT COUNT(*) FROM pitcher_game_logs').fetchone()[0])" 2>/dev/null || echo -1)"
          if [ "$n" -lt 0 ]; then
            echo "::error::Restored database is unreadable/corrupt -> aborting instead of proceeding on bad data."
            exit 1
          fi
          echo "$n" > data/.restore_rows
          echo "DB restored: $(du -h data/kproj.db | cut -f1), pitcher_game_logs=$n"
        else
          echo "::warning::data-latest exists but has no kproj.db.gz asset -> genuine fresh start (bootstrap/recovery)."
          echo "0" > data/.restore_rows
        fi
        if [ "${{ inputs.need-models }}" = "true" ] && printf '%s\n' "$ASSETS" | grep -qx 'models.tgz'; then
          if gh release download data-latest -p models.tgz --clobber 2>/dev/null; then
            tar xzf models.tgz && echo "Models restored."
          else
            echo "::warning::models.tgz is listed but failed to download; continuing without models."
          fi
        fi
